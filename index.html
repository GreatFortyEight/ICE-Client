<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="ICE Client" />
		<title>ICE Client</title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="ICE Client" />
		<meta property="og:description" content="ICE Client" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<script type="text/javascript" src="classes.js" defer></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("ICE Client must be served over HTTP or HTTPS. Upload this folder to a static host or run a local web server.");
					return;
				}

				window.eaglercraftXOpts = {
					demoMode: false,
					container: "game_frame",
					assetsURI: "assets.epk",
					localesURI: "lang/",
					worldsDB: "worlds",
					servers: []
				};

				var query = window.location.search;
				if((typeof query === "string") && query[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
					query = new window.URLSearchParams(query);
					var server = query.get("server");
					if(server) {
						window.eaglercraftXOpts.joinServer = server;
					}
				}

				main();
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
		<div id="ice_bootstrap_splash" style="position:absolute;inset:0;background:black;overflow:hidden;pointer-events:none;">
			<img id="ice_bootstrap_art" src="splash.png" alt="" style="position:absolute;display:block;" />
			<div id="ice_bootstrap_bar" style="position:absolute;box-sizing:border-box;border-style:solid;border-color:white;background:black;">
				<div style="width:10%;height:100%;background:#3FAAE9;"></div>
			</div>
		</div>
		<script type="text/javascript">
			(function() {
				"use strict";
				function layoutIceBootstrapSplash() {
					var art = document.getElementById("ice_bootstrap_art");
					var bar = document.getElementById("ice_bootstrap_bar");
					if(!art || !bar) return;
					var width = window.innerWidth;
					var height = window.innerHeight;
					var scale = Math.min(width / 1280.0, height / 720.0);
					var drawWidth = Math.round(1280.0 * scale);
					var drawHeight = Math.round(720.0 * scale);
					var drawX = Math.round((width - drawWidth) * 0.5);
					var drawY = Math.round((height - drawHeight) * 0.5);
					art.style.left = drawX + "px";
					art.style.top = drawY + "px";
					art.style.width = drawWidth + "px";
					art.style.height = drawHeight + "px";
					bar.style.left = (drawX + Math.round(490.0 * scale)) + "px";
					bar.style.top = (drawY + Math.round(500.0 * scale)) + "px";
					bar.style.width = Math.max(3, Math.round(300.0 * scale)) + "px";
					bar.style.height = Math.max(3, Math.round(8.0 * scale)) + "px";
					bar.style.borderWidth = Math.max(1, Math.round(scale)) + "px";
				}
				window.addEventListener("resize", layoutIceBootstrapSplash);
				layoutIceBootstrapSplash();
			})();
		</script>
	</body>
</html>
